workflows:
  android-build:
    name: Android Build
    max_build_duration: 30
    environment:
      vars:
        JAVA_VERSION: 17
    scripts:
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew :app:clean :app:assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
